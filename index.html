<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Вика: путь наверх</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #1e1226; --panel: #321d3d; --ink: #ffeedd; --muted: #b9a3c4; --accent: #ffb347; --pink: #ff5c8a;
    font-family: "Rubik", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); user-select: none; -webkit-user-select: none; overflow: hidden; }
  header { padding: 14px 0 0; text-align: center; }
  .rank { margin: 0; color: var(--pink); font-weight: 600; font-size: 15px; }
  .score { margin: 2px 0 0; font-size: 46px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .rate { margin: 4px 0 8px; color: var(--accent); font-size: 14px; }
  .bar { height: 10px; border-radius: 6px; background: var(--panel); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--pink), var(--accent)); transition: width .15s; }
  .next { margin: 6px 0 0; color: var(--muted); font-size: 13px; text-align: center; }

  .stage { position: relative; flex: 1; min-height: 190px; display: grid; place-items: center; touch-action: manipulation; }
  .hero { width: min(52vw, 210px); background: none; border: 0; padding: 0; cursor: pointer; transition: transform .08s ease-out; }
  .hero:active { transform: scale(.94) rotate(2deg); }
  .hero svg { width: 100%; height: auto; display: block; }
  .drink { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-weight: 600; font-size: 17px; pointer-events: none; }
  .plus { position: absolute; pointer-events: none; font-weight: 700; font-size: 24px; color: var(--accent); animation: rise .8s ease-out forwards; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  @keyframes rise { to { transform: translateY(-80px); opacity: 0; } }
  .toast { position: absolute; top: 6px; left: 8px; right: 8px; padding: 10px 12px; border-radius: 12px; background: var(--pink); color: #2a0614; font-weight: 700; text-align: center; opacity: 0; transform: translateY(-10px); transition: .3s; pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }

  .shop { display: grid; gap: 8px; padding-bottom: 6px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; text-align: left; width: 100%; padding: 10px 14px; border: 0; border-radius: 14px; background: var(--panel); color: var(--ink); font: inherit; cursor: pointer; }
  .item:disabled { opacity: .5; cursor: default; }
  .item:not(:disabled):active { transform: scale(.98); }
  .name { font-weight: 600; font-size: 16px; }
  .desc { grid-column: 1; color: var(--muted); font-size: 13px; }
  .price { grid-column: 2; grid-row: 1 / span 2; padding: 8px 12px; border-radius: 10px; background: var(--accent); color: #2b1d00; font-weight: 700; font-size: 15px; }
  .item:disabled .price { background: transparent; color: var(--muted); outline: 1px solid var(--muted); }
  .foot { margin: 0 0 10px; text-align: center; color: var(--muted); font-size: 11px; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .plus, .toast, .bar i, .hero { animation-duration: .01s; transition: none; } }
</style>
</head>

    <p class="next" id="next"></p>
  </header>

  let state = { score: 0, total: 0, owned: { lena: 0, bar: 0, cellar: 0 } };
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s.score === 'number') state = { ...state, ...s, owned: { ...state.owned, ...s.owned } };
  } catch (e) {}

  const tierIndex = () => { let i = 0; TIERS.forEach((t, k) => { if (state.total >= t.min) i = k; }); return i; };
  const perSec = () => UPGRADES.reduce((a, u) => a + u.sec * state.owned[u.id], 0);
  const cost = (u) => Math.ceil(u.base * Math.pow(u.growth, state.owned[u.id]));
  const fmt = (n) => Math.floor(n).toLocaleString('ru-RU');
  let shownTier = tierIndex();

  const $ = (id) => document.getElementById(id);
  const buttons = {};
  UPGRADES.forEach((u) => {
    const b = document.createElement('button');
    b.className = 'item';
    b.innerHTML = '<span class="name"></span><span class="price"></span><span class="desc"></span>';
    b.addEventListener('click', () => {
      const c = cost(u);
      if (state.score < c) return;
      state.score -= c; state.owned[u.id]++;
      haptic('medium'); render(); save();
    });
    $('shop').appendChild(b);
    buttons[u.id] = b;
  });

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function gain(n) {
    state.score += n; state.total += n;
    const i = tierIndex();
    if (i > shownTier) { shownTier = i; success(); toast('Вика перешла на новый уровень: ' + TIERS[i].drink + '!'); }
  }

  function render() {
    const i = tierIndex(), t = TIERS[i], nx = TIERS[i + 1];
    $('score').textContent = fmt(state.score);
    $('rank').textContent = t.rank;
    $('rate').textContent = fmt(t.tap) + ' за клик · ' + fmt(perSec()) + ' в секунду';
    $('drink').textContent = t.drink;
    $('liquid').setAttribute('fill', t.color);
    $('foam').style.display = t.foam ? '' : 'none';
    if (nx) {
      $('fill').style.width = Math.min(100, (state.total - t.min) / (nx.min - t.min) * 100) + '%';
      $('next').textContent = 'Дальше: ' + nx.drink + ' — нужно набрать ' + fmt(nx.min) + ' (сейчас ' + fmt(state.total) + ')';
    } else {
      $('fill').style.width = '100%';
      $('next').textContent = 'Вершина! Дальше только похмелье, но не сегодня.';
    }
    UPGRADES.forEach((u) => {
      const b = buttons[u.id];
      b.querySelector('.name').textContent = u.name + ' × ' + state.owned[u.id];
      b.querySelector('.desc').textContent = u.desc;
      b.querySelector('.price').textContent = fmt(cost(u));
      b.disabled = state.score < cost(u);
    });
  }

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  $('hero').addEventListener('pointerdown', (e) => {
    const v = TIERS[tierIndex()].tap;
    gain(v); haptic('light');
    const st = $('stage'), r = st.getBoundingClientRect();
    const p = document.createElement('span');
    p.className = 'plus'; p.textContent = '+' + fmt(v);
    p.style.left = (e.clientX - r.left - 12) + 'px';
    p.style.top = (e.clientY - r.top - 24) + 'px';
    p.addEventListener('animationend', () => p.remove());
    st.appendChild(p);
    render();
  });
  $('hero').addEventListener('click', (e) => { if (e.detail === 0) { gain(TIERS[tierIndex()].tap); render(); } });

  setInterval(() => { const s = perSec(); if (s > 0) { gain(s / 10); render(); } }, 100);
  setInterval(save, 2000);
  document.addEventListener('visibilitychange', save);
  render();
</script>
</body>
</html>
